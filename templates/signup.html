<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div>
                    <a href="/">Forum</a>
                </div>
                <div>
                    <a href="/login">Login</a>
                    <a href="/signup">Sign Up</a>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="main">
        <div class="container">
            <div class="signup max-w-400 mx-auto">
                <h1>Sign Up</h1>
                
                {{if .Error}}
                    <div class="error">
                        {{.Error}}
                    </div>
                {{end}}
                
                <form method="POST" action="/signup">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" maxlength="254" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" maxlength="32" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" maxlength="128" required>
                    </div>
                    
                    <button type="submit" class="btn w-100">Sign Up</button>
                </form>
                
                <div class="mt-1 text-center">
                    <p>Already have an account? <a href="/login">Login here</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
