{{template "base" .}}

{{define "content"}}
<div class="new-post" style="max-width: 800px; margin: 0 auto;">
    <h1>Create New Post</h1>
    
    {{if .Error}}
        <div style="background: #f8d7da; color: #721c24; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
            {{.Error}}
        </div>
    {{end}}
    
    <form method="POST" action="/posts">
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" rows="10" required></textarea>
        </div>
        
        <div class="form-group">
            <label for="categories">Categories (comma-separated):</label>
            <input type="text" id="categories" name="categories" placeholder="general, discussion, help">
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn">Create Post</button>
            <a href="/" class="btn" style="background-color: #6c757d;">Cancel</a>
        </div>
    </form>
</div>
{{end}}
