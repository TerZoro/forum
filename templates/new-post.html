<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post - Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {{template "nav" .}}
    
    <main class="main">
        <div class="container">
            <div class="new-post max-w-800 mx-auto">
                <h1>Create New Post</h1>
                
                {{if .Error}}
                    <div class="error">
                        {{.Error}}
                    </div>
                {{end}}
                
                <form method="POST" action="/posts">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" maxlength="70" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Content:</label>
                        <textarea id="content" name="content" rows="10" maxlength="10000" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="categories">Categories (comma-separated):</label>
                        <input type="text" id="categories" name="categories" maxlength="30" placeholder="general, discussion, help">
                    </div>
                    
                    <div class="flex gap-1">
                        <button type="submit" id="post-submit" class="btn" disabled>Create Post</button>
                        <a href="/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="/static/js/filter.js"></script>
</body>
</html>
