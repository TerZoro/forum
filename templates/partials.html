{{define "nav"}}
<header class="header">
    <div class="container">
        <nav class="nav">
            <div>
                <a href="/">Forum</a>
            </div>
            <div>
                {{if .User}}
                    <a href="/users/{{.User.Username}}">{{.User.Username}}{{if .User.IsAdmin}} <span class="chip">Admin</span>{{end}}</a>
                    <a href="/posts/new">New Post</a>
                    <form method="POST" action="/logout" class="inline">
                        <button type="submit" class="btn-nav-logout">Logout</button>
                    </form>
                {{else}}
                    <a href="/login">Login</a>
                    <a href="/signup">Sign Up</a>
                {{end}}
            </div>
        </nav>
    </div>
</header>
{{end}}
