<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Comment - Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
    </head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div><a href="/">Forum</a></div>
                <div><a href="/posts/{{.PostID}}">Back to Post</a></div>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <h1>Update Comment</h1>
            {{if .Error}}<div class="error-text">{{.Error}}</div>{{end}}
            <form method="POST" action="/posts/{{.PostID}}/comments/{{.Comment.ID}}/edit">
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" required>{{.Comment.Content}}</textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Update Comment</button>
                    <a href="/posts/{{.PostID}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
