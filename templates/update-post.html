<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post - Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div>
                    <a href="/">Forum</a>
                </div>
                <div>
                    <a href="/posts/{{.Post.ID}}">Back to Post</a>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="main">
        <div class="container">
            <h1>Update Post</h1>
            
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            
            <form method="POST" action="/posts/{{.Post.ID}}/edit">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" value="{{.Post.Title}}" required>
                </div>
                
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea id="content" name="content" required>{{.Post.Content}}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="categories">Categories (comma-separated):</label>
                    <input type="text" id="categories" name="categories" value="{{range $i, $cat := .Post.Categories}}{{if $i}}, {{end}}{{$cat}}{{end}}">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn">Update Post</button>
                    <a href="/posts/{{.Post.ID}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
